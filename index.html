<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Form</title>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }
    header{
      display: flex;
      justify-content: center;
      padding: 1rem;
      background-color: cornflowerblue;
    }
    main{
      display: flex;
      align-items: center;
      justify-content: center;
      height: 80vh;
    }
    form{
      padding: 1rem;
      height: auto;
      width: 25rem;
      background-color: aquamarine;
      display: flex;
      flex-direction: column;
      border-radius: 1rem;
      /* gap: 0.5rem; */
    }
    form div{
      /* background-color: red; */
      display: grid;
      /* border: 1px solid black; */
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 3rem;
      height: 3rem;
      align-items: center;
    }
    .dif{
      display: flex;
      height: 2rem;
      /* background-color: white; */
      gap: 0.3rem;
      padding: 0.1rem;
    }
    .dif input{
      width: auto;
    }
    form input , select{
      border: 1px solid black;
      margin: 0.5rem;
      border-radius: 6px;
      padding: 0.3rem;
      font-size: auto;
      width:  12rem;
    }
  </style>
</head>
<body>
  <header><h1>STUDENT FORM</h1></header>
  <main>
    <form action="">
      <div>
        <label for="name">Name:</label>
       <input type="text" id="name"> <br>
      </div>
       <div>
        <label for="matricNumber">Matric Number:</label>
       <input type="number" id="matricNumber"><br>
       </div>
       <div>
        <label for="department">Department</label>
       <select name="department" id="department">
        <option disabled selected value="">Select A Department</option>
        <option value="Computer Science">Computer Science</option>
        <option value="Information Technology and ICT">Information Technology</option>
        <option value="Software Engineering">Software Engineering</option>
        <option value="Information Communication Technology">Information Communication Technology</option>
        <option value="Information Systems">Information Systems</option>
        <option value="CyberSecurity">CyberSecurity</option>
        <option value="Data Science">Data Science</option>
       </select><br>
       </div>
      <div>
        <label for="email">Email</label>
      <input type="email" id="email"> <br>
      </div>
      <div>
        <label for="phoneNumber">Phone Number:</label>
      <input type="tel" id="phoneNumber" placeholder="0123 456 7890" pattern="[0-9]{4}-[0-9]{3}-[0-9]{4}"><br>
      </div>
      <div>
      <label for="gender">Gender:</label>
      <div class="dif">
        <label for="male">Male</label><input name="gender" id="male" type="radio">
      <label for="female">Female</label> <input name="gender" id="female" type="radio"> 
      </div><br>
    </div>
     <div>
       <label for="programme">Programme:</label>
      <select name="programme" id="programme">
         <option disabled selected value="">Choose a programme</option>
        <option value="fulltime">Fulltime</option>
        <option value="weekday">Weekdays</option>
        <option value="weekends">Weekends</option>
      </select><br>
     </div>
      <button type="submit">Submit</button>
    </form>
  </main>
</body>
</html>
